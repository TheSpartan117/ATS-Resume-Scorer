name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger with a custom BASE_URL (e.g., a fresh deployment)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend URL to test (default: localhost dev server)'
        required: false
        default: ''
      api_url:
        description: 'Backend API URL'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (mocked — no live API needed)
        run: npx playwright test e2e/specs/upload.spec.ts e2e/specs/auth.spec.ts e2e/specs/results.spec.ts
        env:
          CI: true
          # Leave BASE_URL unset so playwright.config.ts starts the Vite dev server
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000' }}

      - name: Run smoke tests (requires live deployment)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url != '' }}
        run: npx playwright test e2e/specs/health.spec.ts
        env:
          CI: true
          BASE_URL: ${{ inputs.base_url }}
          VITE_API_URL: ${{ inputs.api_url }}
          API_URL: ${{ inputs.api_url }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload failure screenshots/videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            frontend/artifacts/
            frontend/test-results/
          retention-days: 7
